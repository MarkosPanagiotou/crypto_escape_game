<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 3 - DES Challenge Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <section class="card">
        <span class="badge">Level 3 / DES Encryption</span>
        <h1>DES Challenge Quiz</h1>
        <p>Solve this quiz to reveal the clue for this level.</p>

        <div class="question">Convert the binary number 1010 to decimal.</div>

        <input id="answer" type="text" placeholder="Type your answer here">
        <button onclick="checkAnswer()">Submit Answer</button>

        <div id="result" class="result">Awaiting input...</div>

        <a class="button" href="index.html">Back to Mission Control</a>
    </section>
</main>

<script>
    const correctAnswers = ['10','TEN'];

    function normalize(value) {
        return value.trim().toUpperCase();
    }

    function checkAnswer() {
        const userAnswer = normalize(document.getElementById("answer").value);
        const result = document.getElementById("result");

        if (correctAnswers.includes(userAnswer)) {
            result.innerHTML = `<div class="success"><b>ACCESS GRANTED</b><br>Correct. The DES password/key is: <code>DRAGON</code></div>`;
        } else {
            result.innerHTML = `<div class="error"><b>ACCESS DENIED</b><br>Wrong answer. Try again.</div>`;
        }
    }

    document.getElementById("answer").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            checkAnswer();
        }
    });
</script>
</body>
</html>
