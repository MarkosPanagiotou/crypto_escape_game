<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 4 - AES Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <section class="card">
        <span class="badge">Level 4 / AES Encryption</span>
        <h1>AES Challenge Quiz</h1>

        <p>
            In Level 3, you decrypted the DES file and discovered the AES password/key.
            Enter that key below to continue.
        </p>

        <div class="question">
            What password/key was revealed after decrypting the DES file in Level 3?
        </div>

        <input id="answer" type="text" placeholder="Type your answer here">
        <button onclick="checkAnswer()">Submit Answer</button>

        <div id="result" class="result">Awaiting input...</div>

        <a class="button" href="index.html">Back to Mission Control</a>
    </section>
</main>

<script>
    const correctAnswers = ["MATRIX"];

    function normalize(value) {
        return value.trim().toUpperCase();
    }

    function checkAnswer() {
        const userAnswer = normalize(document.getElementById("answer").value);
        const result = document.getElementById("result");

        if (correctAnswers.includes(userAnswer)) {
            result.innerHTML =
                `<div class="success">
                    <b>ACCESS GRANTED</b><br>
                    Correct. The AES password/key is: <code>MATRIX</code><br><br>
                    Now use OpenSSL to decrypt <code>secret.aes</code>.<br>
                    The decrypted file will reveal the password for Level 5: <code>GALAXY</code>.
                </div>`;
        } else {
            result.innerHTML =
                `<div class="error">
                    <b>ACCESS DENIED</b><br>
                    Wrong answer. Try again.
                </div>`;
        }
    }

    document.getElementById("answer").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            checkAnswer();
        }
    });
</script>
</body>
</html>
